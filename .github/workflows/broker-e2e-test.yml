name: Broker E2E Tests

# Runs the @Tag("broker") outbox → relay → broker end-to-end tests
# (streamrune-integration/streamrune-e2e: OutboxBrokerE2EIT) against REAL Kafka and
# RabbitMQ containers, through the real OutboxPoller and the real
# KafkaOutboxPublisher / RabbitMqOutboxPublisher, with nothing stubbed.
#
# THIS IS THE ONLY PLACE `brokerTest` RUNS. Booting a Kafka or RabbitMQ
# container is materially slower and flakier than the Postgres container the rest of
# the e2e suite shares, so the module's default `test` task EXCLUDES the tag and
# `brokerTest` is deliberately not wired into `check` — which left the only
# end-to-end strict per-aggregate ordering assertion in the repo never executed by
# any pipeline. A change to OutboxPoller's claim/ordering logic that reordered or
# duplicated messages on the wire passed `./gradlew build` and the Build workflow
# green: every OutboxPollerTest uses a fake publisher, and every broker integration
# test in the outbox modules calls publisher.publish(entry) directly, bypassing the
# poller, the claim lease, and per-aggregate ordering entirely.
#
# Three triggers:
#   - push of a v* tag  — a tag pushed by hand. The tag release.yml pushes starts no run: GitHub
#                         starts no workflow for a push made with a workflow's own token.
#   - nightly cron      — catches a regression within a day of it landing on main, and gives the
#                         tip of main the check a release needs.
#   - workflow_dispatch — on demand, e.g. on main before a release when main moved since the
#                         nightly run.
#
# Release gate: no trigger here makes a publish wait for or check this workflow's result. The
# actual gate is verifyReleaseChecks in the root build.gradle.kts (a dependency of the Central
# upload task), which asks the GitHub Actions API for THIS workflow's runs
# (.github/workflows/broker-e2e-test.yml) on the exact commit being released and REFUSES to publish
# unless the job "broker-e2e" of the newest of them concluded `success` — a red night after a green
# one refuses it — overridable only by an explicit, loudly-logged `-PskipCiVerification=true`.
# Renaming this file or the job means changing ReleaseChecks.REQUIRED with them.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC

permissions:
  contents: read

concurrency:
  group: broker-e2e-${{ github.ref }}
  cancel-in-progress: false  # never cancel a tag/release run

jobs:
  broker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'  # matches build.yml; brokerTest needs only a JDK 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Testcontainers boots Postgres, Kafka and RabbitMQ for these tests.
      - name: Verify Docker available
        run: docker info

      - name: Run broker E2E tests (Kafka + RabbitMQ, real relay)
        run: ./gradlew :streamrune-integration:streamrune-e2e:brokerTest --no-daemon --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broker-e2e-reports
          path: 'streamrune-integration/streamrune-e2e/build/reports/tests/'
          if-no-files-found: ignore
