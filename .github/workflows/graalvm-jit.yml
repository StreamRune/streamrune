name: GraalVM JIT

# StreamRune on the Graal JIT compiler. On JDK 25 with the Graal JIT, ScopedValue reads on virtual
# threads are not reliable, and StreamRune refuses to start on such a JVM unless one of two
# workarounds is set: -XX:-UseJVMCICompiler, or -XX:+UnlockDiagnosticVMOptions
# -XX:DisableIntrinsic=_scopedValueCache,_setScopedValueCache (docs/guide/production.md, "Supported
# JVMs"). The Build workflow runs on Temurin, whose JIT is C2, so this is the workflow that runs the
# framework on GraalVM with its default JIT:
#
#   - the JVM check (streamrune-runtime's scopedValueJvmGuardTest, which runs
#     ScopedValueJvmGuardLiveTest on a test JVM without a workaround): the check and the command bus
#     builder must refuse the JVM;
#   - the read stress test of streamrune-runtime (StreamRuneContextVirtualThreadReadTest), on a test
#     JVM with each workaround in turn: it must pass, and it must have run.
#
# Every other test JVM of a GraalVM build runs with a workaround (the root build.gradle.kts).
# Toolchain detection is switched off, so the test JVMs are the GraalVM that setup-graalvm installs
# (JAVA_HOME) and no other JDK 25 of the runner.
#
# Not on every pull request: on every push to main, nightly, and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'  # nightly 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graalvm-jit-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_FLAGS: >-
    --no-daemon --console=plain
    -Porg.gradle.java.installations.auto-detect=false
    -Porg.gradle.java.installations.auto-download=false
  READ_TEST_RESULT: streamrune-runtime/build/test-results/test/TEST-org.streamrune.runtime.StreamRuneContextVirtualThreadReadTest.xml

jobs:
  graalvm-jit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Show the JVM
        run: java -version

      - name: The JVM check refuses the Graal JIT with neither workaround
        run: >-
          ./gradlew :streamrune-runtime:scopedValueJvmGuardTest --rerun
          -PexpectScopedValueJvm=refused $GRADLE_FLAGS

      - name: The read stress test passes with the two intrinsics disabled
        run: |
          ./gradlew :streamrune-runtime:test --tests 'org.streamrune.runtime.StreamRuneContextVirtualThreadReadTest' --rerun \
            -PscopedValueWorkaround=intrinsics -PvirtualThreadReadSeconds=60 $GRADLE_FLAGS
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' "$READ_TEST_RESULT"

      - name: The read stress test passes with the JVMCI compiler switched off
        run: |
          ./gradlew :streamrune-runtime:test --tests 'org.streamrune.runtime.StreamRuneContextVirtualThreadReadTest' --rerun \
            -PscopedValueWorkaround=c2 -PvirtualThreadReadSeconds=60 $GRADLE_FLAGS
          grep -q 'tests="1" skipped="0" failures="0" errors="0"' "$READ_TEST_RESULT"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: graalvm-jit-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
