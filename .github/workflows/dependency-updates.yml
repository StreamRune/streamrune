name: Dependency Updates Check

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 8:00 UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check for dependency updates
        run: ./gradlew dependencyUpdates -Drevision=release --no-daemon --no-parallel

      - name: Report outdated dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT="build/dependencyUpdates/report.txt"
          if [ -f "$REPORT" ] && grep -q "The following dependencies have later" "$REPORT"; then
            OUTDATED=$(grep -A 200 "The following dependencies have later" "$REPORT" | head -100)
            gh issue create \
              --title "Dependency updates available ($(date +%Y-%m-%d))" \
              --body "## Outdated Dependencies

          \`\`\`
          $OUTDATED
          \`\`\`

          ### How to update

          \`\`\`bash
          ./gradlew versionCatalogUpdate
          \`\`\`

          Review the diff in \`gradle/libs.versions.toml\` and commit." \
              --label "dependencies"
          else
            echo "All dependencies up to date."
          fi
