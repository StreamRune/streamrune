name: Fray Concurrency Tests

# Runs the Fray (CMU-PASTA) controlled-scheduler concurrency PROPERTY tests
# (streamrune-runtime/src/fray/java) under a deterministic thread scheduler.
#
# THIS IS THE ONLY PLACE `frayTest` RUNS. Fray 0.8.5 ships no macos-x86_64 JVMTI
# agent, so on the x86_64 macOS dev host the Gradle plugin does not even create
# the `frayTest` task (it prints "unsupported OS/architecture combination") and
# the controlled scheduler cannot run. ubuntu-latest is x86_64 Linux, where the
# JVMTI agent exists and `frayTest` is available.
#
# Fray runs are slow (each @FrayTest explores many interleavings), so this is NOT
# wired into the per-PR / per-push build — it runs on demand and on a weekly schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC

jobs:
  fray:
    runs-on: ubuntu-latest  # x86_64 Linux: the only platform with a Fray JVMTI agent in 0.8.5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'graalvm'  # matches the repo's other workflows; frayTest needs only a JDK 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Fray concurrency property tests
        run: ./gradlew :streamrune-runtime:frayTest --console=plain
