name: Build

# Full framework build on every push to main, every pull request, and every v* tag push:
# compiles all modules, runs the test suite (Testcontainers — PostgreSQL, Kafka, RabbitMQ) and
# enforces the per-module JaCoCo 0.80 instruction + branch coverage gates.
#
# StreamRune declares PostgreSQL 17 or newer, and says so only because both ends of that range
# are tested. The `build` job below runs everything against the newest supported server (18, the
# default of the shared PostgresTestImage); the `postgres-17` job re-runs exactly the
# PostgreSQL-backed suites (`postgresTest`: streamrune-postgres, streamrune-postgres-crypto,
# streamrune-spring, streamrune-quarkus, streamrune-e2e) against postgres:17-alpine. It is a
# separate job, not a matrix leg of `build`, so `build` keeps the exact job name
# verifyReleaseChecks looks up and the 17 leg skips the compile/coverage/Javadoc work that does not
# depend on the server version.
#
# Release gate: verifyReleaseChecks in the root build.gradle.kts (dependsOn'd by the Central upload
# task) asks the GitHub Actions API for this workflow's runs (.github/workflows/build.yml) on the
# exact commit being released and REFUSES to publish unless the jobs "build" and "postgres-17" of the
# newest of them concluded `success` (see ReleaseChecks there). Renaming this file or those jobs
# means changing ReleaseChecks.REQUIRED with them. A release that release.yml cuts comes from a commit of main, whose
# push ran this workflow; the tag release.yml pushes starts no run, because GitHub starts no
# workflow for a push made with a workflow's own token. The `tags: ['v*']` trigger builds a tag
# pushed by hand, so its commit has both checks too, and the gate fails closed for the right reason
# (a check that failed) rather than the wrong one (a check that never ran).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A run in progress is cancelled only for a pull request, where a newer push supersedes it. A run
# for a push to main or for a tag always finishes: the snapshot publication (publish-snapshot.yml)
# waits for this workflow's result on exactly that commit, and a tag push is a release cut. Runs of
# one ref still share a group, so pushes to main are built one after another, in push order; when
# they arrive faster than a build takes, GitHub keeps only the newest waiting run, so the tip of
# main is always built and the snapshot never moves back to an older commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # ubuntu-latest ships a Docker daemon; the integration tests need it for Testcontainers.
      - name: Verify Docker available
        run: docker info

      - name: Build (compile + test + JaCoCo 0.80 gates)
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  # The PostgreSQL-backed suites against the OLDEST supported server. The default leg above is
  # PostgreSQL 18; this one proves the declared minimum. -PpostgresImage reaches every Testcontainers
  # container through PostgresTestImage (verifyPostgresTestImage, part of `check`, fails the build
  # when a test names an image of its own), and it is a test-task input, so this run is never served
  # from a result cached by the 18 run.
  postgres-17:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Verify Docker available
        run: docker info

      - name: PostgreSQL-backed suites on postgres:17-alpine
        run: ./gradlew postgresTest -PpostgresImage=postgres:17-alpine --no-daemon --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-postgres-17
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
