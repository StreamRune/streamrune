# Quarkus initializes every class at image build time, and Flyway's InsertRowLock keeps a
# java.util.Random in a static field. A Random created during the build would give every start of
# the binary the same seed, so native-image refuses one in the image heap and the build fails.
# Initializing the class at run time creates the Random when the binary first locks a schema
# history table.
Args = --initialize-at-run-time=org.flywaydb.core.internal.database.InsertRowLock
