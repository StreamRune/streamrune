# The datasource is the PostgreSQL container PostgresResource starts.
quarkus.datasource.db-kind=postgresql
quarkus.devservices.enabled=false
# A free port, so that the test never collides with another application or build on this machine.
quarkus.http.test-port=0

# The projection keys, read by name, set in the configuration file.
streamrune.projections.auto-discovery.enabled=true
streamrune.projections.audit-log.enabled=false
streamrune.projections.order-totals.error-strategy=SKIP

# Read when a request arrives, not while the application initializes.
streamrune.security.trust-user-id-header=true
